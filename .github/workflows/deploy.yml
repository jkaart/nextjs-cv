name: Deployment
env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  NEXT_PUBLIC_BASE_URL: ${{ secrets.NEXT_PUBLIC_BASE_URL }}
on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
  repository_dispatch:
    types: [sync-content]
jobs:
  Debug:
    runs-on: ubuntu-latest
    steps:
      - name: Debug workflow_run
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Actor: ${{ github.event.workflow_run.actor.login }}"
          echo "Branch: ${{ github.event.workflow_run.head_branch }}"
          echo "SHA: ${{ github.event.workflow_run.head_sha }}"
          echo "Message: ${{ github.event.workflow_run.head_commit.message }}"
          echo "Payload: ${{ github.event.client_payload}}"
          echo "Payload branch: ${{ github.event.client_payload.branch }}"
          echo "Payload content_only: ${{ github.event.client_payload.content_only }}"
  DeployProduction:
    if: >
      (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.actor.login != 'semantic-release-bot' &&
        github.event.workflow_run.head_branch == 'main') ||
        (github.event_name == 'repository_dispatch' &&
        github.event.client_payload.branch == 'main' &&
        github.event.client_payload.content_only == true)

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Clone private content
        run: |
          rm -rf ../data
          git clone https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/${{ secrets.PRIVATE_REPO }} ../data

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  DeployPreview:
    if: >
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login != 'semantic-release-bot' &&
      github.event.workflow_run.head_branch == 'dev') ||
      (github.event_name == 'repository_dispatch' &&
      github.event.client_payload.branch == 'dev' &&
      github.event.client_payload.content_only == true)

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Clone private content
        run: |
          rm -rf ../data
          git clone https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/${{ secrets.PRIVATE_REPO }} ../data

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}
