name: CI
concurrency:
  group: ci-${{ github.ref_name }}
  cancel-in-progress: true
env:
  NEXT_PUBLIC_BASE_URL: ${{ secrets.NEXT_PUBLIC_BASE_URL }}
on:
  push:
  pull_request:

permissions:
  pull-requests: write
  contents: read
  packages: write

jobs:
  CommitLint:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: git fetch origin main:main
      - run: npm ci
      - name: Validate commits
        run: npx commitlint --from=main --to=HEAD

  LintPR:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      statuses: write

    steps:
      - name: Lint PR title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            test
            chore

  Lint:
    runs-on: ubuntu-latest
    needs: [CommitLint]

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run Lint
        run: npm run lint

  Test:
    runs-on: ubuntu-latest
    needs: [Lint, CommitLint]

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm run test

  Build:
    runs-on: ubuntu-latest
    needs: [Lint, Test, CommitLint]

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Clone data
        run: |
          rm -rf ../data
          git clone https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/${{ secrets.PRIVATE_REPO }} ../data

      - name: Install dependencies
        run: npm ci
      - name: Run build
        run: npm run build
