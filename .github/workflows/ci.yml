name: CI
env:
  NEXT_PUBLIC_BASE_URL: ${{ secrets.NEXT_PUBLIC_BASE_URL }}
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  repository_dispatch:
    types: [sync-content]

permissions:
  pull-requests: write
  contents: read
  packages: write

jobs:
  CommitLint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.client_payload.branch || github.ref_name }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - run: npm install --package-lock-only
      - run: npm ci

      - name: Validate commits
        run: npx commitlint --from=origin/main --to=HEAD

  LintPR:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      statuses: write

    steps:
      - name: Lint PR title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            test
            chore

  Lint:
    runs-on: ubuntu-latest
    needs: [CommitLint]

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.client_payload.branch || github.ref_name }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm install
      - name: Run Lint
        run: npm run lint

  Test:
    runs-on: ubuntu-latest
    needs: [Lint, CommitLint]

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.client_payload.branch || github.ref_name }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm run test

  Build:
    runs-on: ubuntu-latest
    needs: [Lint, Test, CommitLint]

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.client_payload.branch || github.ref_name }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Clone data
        run: |
          rm -rf ../data
          git clone https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/${{ secrets.PRIVATE_REPO }} ../data

      - name: Install dependencies
        run: npm install
      - name: Run build
        run: npm run build
