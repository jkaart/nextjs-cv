name: Release
on:
  workflow_run:
    workflows: ["Deployment & publish source"]
    types:
      - completed
jobs:
  Release:
    if: ${{ github.event.workflow_run.head_branch == 'main' && !contains(github.event.workflow_run.head_commit.message, '#skip') }}
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - run: npm install --package-lock-only
      - run: npm ci

      - name: Run semantic-release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: 0
