name: Release
on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
jobs:
  Release:
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      (
        startsWith(github.event.workflow_run.head_commit.message,'/feat:') ||
        startsWith(github.event.workflow_run.head_commit.message,'/fix:') ||
        startsWith(github.event.workflow_run.head_commit.message,'/refactor:') ||
        startsWith(github.event.workflow_run.head_commit.message,'/perf:') ||
        startsWith(github.event.workflow_run.head_commit.message,'/build:')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - run: npm install --package-lock-only
      - run: npm ci

      - name: Run semantic-release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: 0
