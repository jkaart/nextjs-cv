name: Deployment pipeline
env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
on:
  push:
    branches: "**"
  pull_request:
    branches: [ main ]
jobs:
  CommitLint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - run: npm ci

      - name: Validate commits
        run: npx commitlint --from=origin/main --to=HEAD
  Lint:
    runs-on: ubuntu-latest
    needs: [ CommitLint ]

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm install
      - name: Run Lint
        run: npm run lint

  Test:
    runs-on: ubuntu-latest
    needs: [ Lint, CommitLint]

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm run test
  Build:
    runs-on: ubuntu-latest
    needs: [ Lint, Test, CommitLint ]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm install
      - name: Run build
        run: npm run build
  Deploy:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '#skip') }}
    name: Deploy
    runs-on: ubuntu-latest
    needs: [ Build, CommitLint ]
    steps:
      - uses: actions/checkout@v6
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
  PublishSource:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main'  && !contains(github.event.head_commit.message, '#skip') }}
    runs-on: ubuntu-latest
    needs: [ Test, Deploy, CommitLint ]

    steps:
      - name: Checkout private repo
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install git-filter-repo
        run: pip install git-filter-repo
      - name: Clone repo
        run: |
          git clone --mirror https://${{ secrets.PUBLIC_REPO_TOKEN }}@github.com/${{ github.repository }} public_repo 
      - name: Filter repo
        run: |
          cd public_repo
          git filter-repo \
          --invert-paths \
          --path src/data/ \
          --path .github/workflows/
      - name: Push to public repo
        run: |
          cd public_repo
          git remote add public https://${{ secrets.PUBLIC_REPO_TOKEN }}@github.com/jkaart/nextjs-cv.git
          git push -f public HEAD:main
  Release:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '#skip') }}
    needs: [ Deploy, CommitLint ]
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - run: npm ci

      - name: Run semantic-release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
