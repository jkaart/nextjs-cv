name: Deployment pipeline
on:
  push:
    branches:
      - main
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize ]
jobs:
  Test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm install
      - name: Run test
        run: npm run test
  Publish_source:
    runs-on: ubuntu-latest
    needs: [ Test ]

    steps:
      - name: Checkout private repo
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install git-filter-repo
        run: pip install git-filter-repo
      - name: Clone repo
        run: |
          git clone --mirror https://${{ secrets.PUBLIC_REPO_TOKEN }}@github.com/${{ github.repository }} public_repo 
      - name: Filter repo
        run: |
          cd public_repo
          git filter-repo \
          --invert-paths \
          --path src/data/ \
          --path .github/workflows/publish-source.yml
      - name: Push to public repo
        run: |
          cd public_repo
          git remote add public https://${{ secrets.PUBLIC_REPO_TOKEN }}@github.com/jkaart/nextjs-cv.git
          git push -f public HEAD:main
