name: Deployment pipeline
env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  SKIP_CONDITION: ${{ contains(join(github.event.commits.*.message, ''), '#skip') }}
on:
  push:
    branches:
      - main
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize ]
jobs:
  Lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm install
      - name: Run Lint
        run: npm run lint

  Test:
    runs-on: ubuntu-latest
    needs: [ Lint ]

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm run test
  Deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [ Test ]
    steps:
      - uses: actions/checkout@v6
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN
          }}
      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
  Publish_source:
    runs-on: ubuntu-latest
    needs: [ Test, Deploy ]

    steps:
      - name: Checkout private repo
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install git-filter-repo
        run: pip install git-filter-repo
      - name: Clone repo
        run: |
          git clone --mirror https://${{ secrets.PUBLIC_REPO_TOKEN }}@github.com/${{ github.repository }} public_repo 
      - name: Filter repo
        run: |
          cd public_repo
          git filter-repo \
          --invert-paths \
          --path src/data/ \
          --path .github/workflows/
      - name: Push to public repo
        run: |
          cd public_repo
          git remote add public https://${{ secrets.PUBLIC_REPO_TOKEN }}@github.com/jkaart/nextjs-cv.git
          git push -f public HEAD:main
  Tag_release:
    needs: [ Deploy ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Bump version and push tag
        if: ${{ github.event_name == 'push' && env.SKIP_CONDITION  == 'false'}}
        uses: anothrNick/github-tag-action@4ed44965e0db8dab2b466a16da04aec3cc312fd8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: patch
